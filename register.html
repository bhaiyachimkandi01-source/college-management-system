<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration - CMS</title>
  <link rel="stylesheet" href="css/unified.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="loader-overlay" id="loader"><div class="spinner"></div></div>
  <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>

  <div class="auth-section">
    <div class="auth-container">
      <div class="auth-box">
        <h2><i class="fas fa-user-plus"></i> Student Registration</h2>
        <p class="subtitle">Create your student account</p>
        
        <form id="registerForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter full name" required />
            </div>
            <div class="form-group">
              <label>Roll Number</label>
              <input type="text" id="rollNumber" class="form-control" placeholder="e.g., CS001" required />
            </div>
          </div>
          
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@college.edu" required />
          </div>
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="password" class="form-control" placeholder="Create password" required />
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required />
            </div>
          </div>
          
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label>Department</label>
              <select id="department" class="form-control" required>
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="English">English</option>
              </select>
            </div>
            <div class="form-group">
              <label>Course</label>
              <select id="course" class="form-control" required>
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.A">B.A</option>
                <option value="M.Tech">M.Tech</option>
              </select>
            </div>
            <div class="form-group">
              <label>Semester</label>
              <select id="semester" class="form-control" required>
                <option value="">Select Semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
                <option value="3">3rd Semester</option>
                <option value="4">4th Semester</option>
                <option value="5">5th Semester</option>
                <option value="6">6th Semester</option>
                <option value="7">7th Semester</option>
                <option value="8">8th Semester</option>
              </select>
            </div>
          </div>
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="phone" class="form-control" placeholder="Enter phone number" />
            </div>
            <div class="form-group">
              <label>Date of Birth</label>
              <input type="date" id="dob" class="form-control" />
            </div>
          </div>
          
          <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" id="profilePhoto" class="form-control" accept="image/*" />
          </div>
          
          <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="auth-links">
          Already have an account? <a href="index.html">Login here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/unified.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }
      
      showLoader();
      
      try {
        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('rollNumber', document.getElementById('rollNumber').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('password', password);
        formData.append('department', document.getElementById('department').value);
        formData.append('course', document.getElementById('course').value);
        formData.append('semester', document.getElementById('semester').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('dob', document.getElementById('dob').value);
        
        const photoFile = document.getElementById('profilePhoto').files[0];
        if (photoFile) {
          formData.append('profilePhoto', photoFile);
        }
        
        // In real app, this would call the API
        console.log('Registration data:', Object.fromEntries(formData));
        
        showToast('Registration successful! Please login.', 'success');
        setTimeout(() => window.location.href = 'index.html', 2000);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
      } finally {
        hideLoader();
      }
    });
  </script>
</body>
</html>
