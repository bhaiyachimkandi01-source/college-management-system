<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login - CMS Portal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="loader-overlay" id="loader"><div class="spinner"></div></div>
  <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>

  <div class="auth-page">
    <div class="auth-box">
      <h2><i class="fas fa-graduation-cap text-primary"></i> Student Login</h2>
      <p class="subtitle">Welcome back! Please login to your account.</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Roll Number</label>
          <input type="text" id="rollNumber" class="form-control" placeholder="25CSE0002" maxlength="10" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required />
        </div>
        <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;font-size:0.9rem;">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#" style="color:var(--primary);">Forgot password?</a>
        </div>
        <button type="submit" class="btn-submit">Login</button>
      </form>
      <div class="auth-links">
        Don't have an account? <a href="register.html">Register here</a><br>
        <a href="index.html">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api.auth.login({
          rollNumber: document.getElementById('rollNumber').value,
          password: document.getElementById('password').value
        });
        localStorage.setItem('studentToken', data.token);
        localStorage.setItem('studentUser', JSON.stringify(data.user));
        showToast('Login successful!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) { showToast(err.message, 'error'); }
    });
  </script>
</body>
</html>
