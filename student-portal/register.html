<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Register - CMS Portal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="loader-overlay" id="loader"><div class="spinner"></div></div>
  <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>

  <div class="auth-page">
    <div class="auth-box">
      <h2><i class="fas fa-graduation-cap text-primary"></i> Student Registration</h2>
      <p class="subtitle">Create your student account to get started.</p>
      <form id="registerForm">
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label>Roll Number</label>
            <input type="text" id="rollNumber" class="form-control" placeholder="25CSE0002" maxlength="10" required />
          </div>
        </div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+1 555 123 4567" />
          </div>
        </div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Gender</label>
            <select id="gender" class="form-control">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" class="form-control" />
          </div>
        </div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Department</label>
            <select id="department" class="form-control">
              <option value="">Select Department</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Electronics">Electronics</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
              <option value="Business">Business</option>
            </select>
          </div>
          <div class="form-group">
            <label>Course</label>
            <input type="text" id="course" class="form-control" placeholder="e.g. B.Tech" />
          </div>
        </div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Semester</label>
            <input type="number" id="semester" class="form-control" min="1" max="8" value="1" />
          </div>
          <div class="form-group">
            <label>Batch</label>
            <input type="text" id="batch" class="form-control" placeholder="e.g. 2024-2028" />
          </div>
        </div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required />
          </div>
        </div>
        <div class="form-group">
          <label>Profile Picture</label>
          <input type="file" id="profilePhoto" class="form-control" accept="image/*" />
        </div>
        <button type="submit" class="btn-submit">Register</button>
      </form>
      <div class="auth-links">
        Already have an account? <a href="login.html">Login here</a><br>
        <a href="index.html">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
      try {
        const data = await api.auth.register({
          name: document.getElementById('name').value,
          rollNumber: document.getElementById('rollNumber').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          gender: document.getElementById('gender').value,
          dob: document.getElementById('dob').value,
          department: document.getElementById('department').value,
          course: document.getElementById('course').value,
          semester: parseInt(document.getElementById('semester').value),
          batch: document.getElementById('batch').value,
          password: password
        });
        localStorage.setItem('studentToken', data.token);
        localStorage.setItem('studentUser', JSON.stringify(data.user));

        const fileInput = document.getElementById('profilePhoto');
        if (fileInput.files.length > 0) {
          const fd = new FormData(); fd.append('file', fileInput.files[0]);
          try { await api.upload(fd); } catch(e){}
        }

        showToast('Registration successful!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) { showToast(err.message, 'error'); }
    });
  </script>
</body>
</html>
